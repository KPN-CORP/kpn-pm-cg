---
# Single deploy config for the kpn-pm app, shared by production and staging.
# The target is chosen by the repository folder it runs in, so this file is
# IDENTICAL on every branch — no per-environment edits, no merge conflicts.
#
#   repo folder kpn-pm-cg        -> PRODUCTION  (branch: main)
#   repo folder kpn-pm-cg-stage  -> STAGING     (branch: development)
#
# Do NOT edit this file on the server. Change it locally, commit, push, deploy.

deployment:
  tasks:
    - |
      set -e
      REPO="$(basename "$(pwd)")"
      case "$REPO" in
        kpn-pm-cg)                             # PRODUCTION
          DEPLOYPATH=/home/hcispanel/kpn-pm-cg
          PUBHTML=/home/hcispanel/public_html/kpncorporation-cg.hcis.live
          ;;
        kpn-pm-cg-stage)                       # STAGING
          DEPLOYPATH=/home/hcispanel/kpn-pm-cg-stage
          PUBHTML=/home/hcispanel/public_html/kpncorporation-cg-staging.hcis.live
          ;;
        *)
          echo "Unknown repo folder: $REPO — refusing to deploy"; exit 1
          ;;
      esac
      echo "Deploying $REPO -> $DEPLOYPATH  (assets: $PUBHTML)"

      # Ensure deployment folder exists
      mkdir -p $DEPLOYPATH
      mkdir -p $DEPLOYPATH/public
      mkdir -p $DEPLOYPATH/public/build
      mkdir -p $DEPLOYPATH/public/css
      mkdir -p $DEPLOYPATH/public/img
      mkdir -p $DEPLOYPATH/public/images
      mkdir -p $DEPLOYPATH/public/js
      mkdir -p $DEPLOYPATH/public/scss
      mkdir -p $DEPLOYPATH/storage
      mkdir -p $DEPLOYPATH/bootstrap/cache

      # Copy application code into the live app directory
      cp -r app bootstrap config database routes resources "$DEPLOYPATH"/
      cp -r public/build public/css public/img public/images public/js public/scss "$DEPLOYPATH"/public/

      # Change to deployment directory
      cd $DEPLOYPATH

      # Install composer dependencies
      composer install --ignore-platform-reqs --no-dev --optimize-autoloader

      # Install Node packages
      npm install --legacy-peer-deps --no-audit
      npm run build

      # Set correct permissions
      chmod -R 755 storage
      chmod -R 755 bootstrap/cache

      # Refresh Laravel caches in the live app
      php artisan view:clear
      php artisan optimize:clear

      # Copy public assets into the site document root
      cp -r public/build public/css public/img public/images public/js public/scss "$PUBHTML"/
